<!doctype html>
<html>
  <head>
    <style type="text/css">
      .Mailer {
        margin: auto;
        border: 1px solid #eee;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        font-family: "Poppins", sans-serif;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <table
      class="Mailer"
      align="center"
      cellpadding="10"
      width="500"
      height="500"
      style="background: #f0f0f0"
    >
      <tr>
        <td>
          <table
            style="background: #fff; overflow: hidden; border-radius: 10pt"
            height="350"
            width="475"
          >
            <tr align="center">
              <td style="padding: 20pt">
                <img
                  src="http://mybond.in/images/mybond.png"
                  style="width: 150pt"
                  alt="mybond Logo"
                />
              </td>
            </tr>
            <tr>
              <td style="padding: 20pt">
                <div>
                  <div
                    style="
                      font-size: 0.9rem;
                      font-weight: 500;
                      line-height: 1.5;
                    "
                  >
                    <span style="font-weight: 700">Dear {Name},</span>
                    <br /><br />
                    Your One-Time Password (OTP) for verification is:
                  </div>
                  <br /><br />
                  <div
                    style="
                      font-size: 0.9rem;
                      font-weight: 700;
                      margin-left: 100px;
                      line-height: 1.5;
                    "
                  >
                    {OTP CODE}
                  </div>
                  <br />
                  <div
                    style="
                      font-size: 0.8rem;
                      font-weight: 500;
                      line-height: 1.5;
                    "
                  >
                    <p>
                      This OTP is valid for [10] minutes and can only be used
                      once.
                    </p>
                    <br />
                    <p style="margin: 0; font-weight: 700">
                      Team, <br />
                      MyBond<br />
                      +91 9350316010
                    </p>
                    <br />
                  </div>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
