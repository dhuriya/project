<!doctype html>
<html>
  <head>
    <style type="text/css">
      .Mailer {
        margin: auto;
        border: 1px solid #eee;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        font-family: "Poppins", sans-serif;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <table
      class="Mailer"
      align="center"
      cellpadding="10"
      width="600"
      style="background: #f0f0f0"
    >
      <tr>
        <td align="center" style="padding: 20pt 0 0">
          <table>
            <tr>
              <td width="45%"></td>
              <td width="10%">
                <img
                  src="http://mybond.in/images/mybond.png"
                  style="width: 150pt"
                  alt="mybond Logo"
                />
              </td>
              <td width="45%"></td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td>
          <table
            style="background: #fff; overflow: hidden; border-radius: 10pt"
          >
            <tr>
              <td style="padding: 20pt">
                <div>
                  <div
                    style="
                      font-size: 0.9rem;
                      font-weight: 500;
                      line-height: 1.5;
                    "
                  >
                    <span style="font-weight: 700">KYC Completed – Account Under Process</span>
                    <br /><br />
                    <p>Dear Sir/Madam,</p>
                    <br>
                    Your KYC has been successfully completed. However, your account is currently under process and will be activated shortly.
                    <p>Thank you for your patience.</p>
                  </div>
                  <br />
                  <br />
                  <p style="margin: 0; font-weight: 700">
                      Best Regards,<br />
                      {Name}
                    </p>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
