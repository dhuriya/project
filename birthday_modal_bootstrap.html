<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  :root {
    --ink: #0A1628;
    --ink-soft: #1F2D44;
    --gold: #B8924D;
    --gold-soft: #E8D9B8;
    --paper: #F5F1E8;
    --paper-hover: #FAF6EA;
    --card: #FFFFFF;
    --border: #E8E1D0;
    --muted: #6B7180;
    --success: #2F7A5B;
    --success-bg: #E3F0E9;
    --warn-bg: #FBEEDC;
    --warn-fg: #8A5A1C;
  }

  body {
    background: var(--paper);
  }

  .action-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }

  .action-row:hover {
    background: var(--paper-hover);
    border-color: var(--gold-soft);
  }

  .action-icon {
    width: 40px;
    height: 40px;
    background: var(--warn-bg);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 16px;
    flex-shrink: 0;
  }

  .action-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }

  .action-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .action-count {
    background: var(--warn-bg);
    color: var(--warn-fg);
    font-size: 12px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--gold-soft);
    margin-left: auto;
  }

  .action-chevron {
    color: var(--border);
    font-size: 13px;
  }

  .modal-content {
    border: 1px solid var(--border) !important;
    border-radius: 18px !important;
    overflow: hidden;
  }

  .modal-header {
    background: var(--ink);
    border-bottom: none !important;
    padding: 16px 20px 14px;
  }

  .modal-header .modal-title {
    color: var(--gold-soft);
    font-size: 15px;
    font-weight: 500;
  }

  .modal-header .bi-gift {
    color: var(--gold);
    font-size: 16px;
  }

  .btn-close-custom {
    background: none;
    border: none;
    color: rgba(232, 217, 184, 0.6);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    transition: color 0.15s;
  }

  .btn-close-custom:hover {
    color: var(--gold-soft);
  }

  .modal-body {
    padding: 16px 20px 4px;
    background: var(--card);
  }

  .client-count-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--warn-bg);
    color: var(--warn-fg);
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--gold-soft);
    margin-bottom: 12px;
  }

  .form-label-sm {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: block;
  }

  .msg-textarea {
    width: 100%;
    resize: none;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--ink);
    font-family: inherit;
    line-height: 1.55;
    outline: none;
    transition: border-color 0.15s;
  }

  .msg-textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184, 146, 77, 0.12);
  }

  .tpl-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }

  .tpl-chip {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.13s;
    font-family: inherit;
  }

  .tpl-chip:hover {
    border-color: var(--gold-soft);
    background: var(--warn-bg);
    color: var(--gold);
  }

  .modal-footer {
    background: var(--card);
    border-top: 1px solid var(--border) !important;
    padding: 12px 20px;
    gap: 8px;
  }

  .btn-cancel-custom {
    flex: 1;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.14s;
  }

  .btn-cancel-custom:hover {
    background: var(--paper);
    color: var(--ink);
  }

  .btn-send-custom {
    flex: 2;
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: var(--ink);
    color: var(--gold-soft);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.15s;
  }

  .btn-send-custom:hover {
    background: var(--ink-soft);
  }

  .toast-container-custom {
    position: absolute;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
  }

  .toast-success {
    background: var(--ink);
    border: 1px solid rgba(184, 146, 77, 0.3);
    border-radius: 12px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 220px;
  }

  .toast-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--success-bg);
    color: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .toast-text {
    font-size: 13px;
    font-weight: 500;
    color: var(--gold-soft);
  }

  .toast-sub {
    font-size: 11px;
    color: rgba(232, 217, 184, 0.55);
  }

  .page-wrap {
    padding: 20px;
    background: var(--paper);
    border-radius: 16px;
    min-height: 220px;
    position: relative;
  }

  .section-lbl {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.07em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
</style>

<div class="page-wrap">
  <div class="section-lbl">Today's actions</div>

  <div class="action-row" data-bs-toggle="modal" data-bs-target="#bdayModal">
    <div class="action-icon"><i class="bi bi-gift"></i></div>
    <div class="flex-grow-1">
      <div class="action-title">Client birthday</div>
      <div class="action-sub">client birthday</div>
    </div>
    <span class="action-count">12</span>
    <i class="bi bi-chevron-right action-chevron"></i>
  </div>

  <div class="toast-container-custom d-none" id="toastWrap">
    <div class="toast-success">
      <div class="toast-icon"><i class="bi bi-check2"></i></div>
      <div>
        <div class="toast-text">Wishes sent!</div>
        <div class="toast-sub">12 clients notified</div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="bdayModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:400px;">
    <div class="modal-content shadow-sm">

      <div class="modal-header d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-gift"></i>
          <span class="modal-title">Birthday wishes</span>
        </div>
        <button class="btn-close-custom" data-bs-dismiss="modal"><i class="bi bi-x"></i></button>
      </div>

      <div class="modal-body">
        <div class="client-count-badge">
          <i class="bi bi-people" style="font-size:12px;"></i>
          12 clients celebrating today
        </div>

        <div class="form-label-sm">Quick templates</div>
        <div class="tpl-chips">
          <button class="tpl-chip" onclick="setTpl(0)">🎉 Classic</button>
          <button class="tpl-chip" onclick="setTpl(1)">🌟 Warm</button>
          <button class="tpl-chip" onclick="setTpl(2)">💼 Formal</button>
        </div>

        <div class="form-label-sm">Message</div>
        <textarea class="msg-textarea" id="msgBox" rows="4" placeholder="Write a birthday message..."></textarea>
      </div>

      <div class="modal-footer d-flex">
        <button class="btn-cancel-custom" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-send-custom" onclick="sendWish()">
          <i class="bi bi-send" style="font-size:13px;"></i> Send wishes
        </button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const tmpls = [
    "Wishing you a wonderful birthday! May this special day bring you joy and happiness. Looking forward to continuing our journey together.",
    "Happy Birthday! It's always a pleasure working with you. Hope your day is as amazing as the work you do. Cheers to another great year!",
    "Dear client, our team extends warmest birthday wishes. May this year bring you great success and fulfilment in all your endeavours.",
  ];

  document.getElementById('msgBox').value = tmpls[0];

  function setTpl(i) {
    document.getElementById('msgBox').value = tmpls[i];
    document.getElementById('msgBox').focus();
  }

  function sendWish() {
    const msg = document.getElementById('msgBox').value.trim();
    if (!msg) {
      document.getElementById('msgBox').style.borderColor = '#B93A3A';
      setTimeout(() => document.getElementById('msgBox').style.borderColor = '', 1200);
      return;
    }
    bootstrap.Modal.getInstance(document.getElementById('bdayModal')).hide();
    const wrap = document.getElementById('toastWrap');
    wrap.classList.remove('d-none');
    setTimeout(() => wrap.classList.add('d-none'), 3000);
  }
</script>
